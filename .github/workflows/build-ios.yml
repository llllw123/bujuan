name: Simple iOS Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      
    - name: Create minimal pubspec override
      run: |
        echo "创建临时 pubspec.yaml 测试..."
        cp pubspec.yaml pubspec.yaml.backup
        # 创建一个简化的版本，只保留基本依赖
        cat > pubspec_minimal.yaml << EOF
        name: test_build
        environment:
          sdk: ">=2.12.0 <3.0.0"
        dependencies:
          flutter:
            sdk: flutter
          bujuan_music_api:
            git:
              url: https://github.com/llllw123/bujuan_music_api.git
              ref: master
        EOF
        mv pubspec_minimal.yaml pubspec.yaml
        
    - name: Test dependency resolution
      run: |
        flutter pub get
        echo "依赖解析成功！"
        
    - name: Restore original pubspec
      if: always()
      run: |
        mv pubspec.yaml.backup pubspec.yaml || true

name: Simple iOS Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      
    - name: Get dependencies
      run: flutter pub get
      
    - name: Build IPA
      run: flutter build ipa --no-codesign
      
    - name: Upload build
      uses: actions/upload-artifact@v4
      with:
        name: app-build
        path: build/ios/ipa/

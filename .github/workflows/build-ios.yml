name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    name: Build Flutter iOS IPA
    runs-on: macos-latest

    steps:
    - name: Checkout main project
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.5'

    - name: Verify dependency configuration
      run: |
        echo "=== 检查依赖配置 ==="
        grep -A 3 "bujuan_music_api" pubspec.yaml
        echo "API 仓库分支: $(grep -A 3 "bujuan_music_api" pubspec.yaml | grep "ref:" | cut -d: -f2 | tr -d ' ')"
        
    - name: Install dependencies
      run: |
        echo "开始安装依赖..."
        flutter pub get --verbose
        
    - name: Build iOS IPA
      run: flutter build ipa --no-codesign --release

    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: iOS-IPA
        path: build/ios/ipa/*.ipa
        retention-days: 7
